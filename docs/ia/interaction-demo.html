  align-self: start;
}

.era-side h2 {
  margin: 0 0 8px;
  font-size: clamp(22px, 2.4vw, 30px);
}

.era-range {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
}

.era-thesis {
  margin: 10px 0 12px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.event-list {
  display: grid;
  gap: 10px;
}

.event-card {
  width: 100%;
  padding: 18px 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: inherit;
  background: var(--paper);
  text-align: left;
  cursor: pointer;
  transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
}

.event-card:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

.event-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 8px;
  color: var(--faint);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.05em;
}

.lane {
  padding: 2px 6px;
  border-radius: 3px;
  color: var(--teal);
  background: var(--teal-soft);
}

.event-title {
  margin: 0 0 6px;
  font-size: clamp(18px, 2vw, 23px);
}

.event-shift {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.event-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.event-chips .chip {
  font-size: 10px;
  padding: 3px 7px;
}

.timeline-note {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  align-items: center;
  padding: 12px 0 0;
  color: var(--faint);
  font-size: 10px;
}

/* --------------------------------------------------------------------------
   Definitions
   -------------------------------------------------------------------------- */

.definition-tabs {
  display: flex;
  gap: 6px;
  padding: 16px 0;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
}

.definition-tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  flex: 0 0 auto;
  padding: 9px 14px;
  border: 1px solid transparent;
  border-radius: 999px;
  color: var(--muted);
  background: transparent;
  font-size: 12px;
  cursor: pointer;
  transition: color 140ms ease, background-color 140ms ease, border-color 140ms ease;
}

.tab:hover {
  border-color: var(--line);
  color: var(--ink);
}

.tab[aria-selected="true"] {
  border-color: var(--ink);
  color: var(--bg);
  background: var(--ink);
}

.definition-panel {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(280px, 0.7fr);
  gap: 32px;
  margin-top: 20px;
  padding: 26px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.definition-panel h2 {
  margin: 0 0 10px;
  font-size: clamp(28px, 3.2vw, 42px);
}

.def-thesis {
  margin: 0 0 18px;
  font-size: 17px;
  line-height: 1.75;
}

.def-scope {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.75;
}

.def-side {
  display: grid;
  gap: 14px;
  align-content: start;
  padding-left: 26px;
  border-left: 1px solid var(--line);
}

.def-block h3 {
  margin: 0 0 7px;
  color: var(--faint);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.def-block p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.boundary-wrap {
  margin-top: 20px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.boundary-table {
  width: 100%;
  min-width: 900px;
  border-collapse: separate;
  border-spacing: 0;
}

.boundary-table th,
.boundary-table td {
  padding: 10px 12px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}

.boundary-table th:last-child,
.boundary-table td:last-child {
  border-right: 0;
}

.boundary-table tbody tr:last-child > * {
  border-bottom: 0;
}

.boundary-table thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  color: var(--muted);
  background: var(--paper-2);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.boundary-table tbody th {
  position: sticky;
  left: 0;
  z-index: 1;
  min-width: 150px;
  background: var(--paper);
  font-size: 12px;
  font-weight: 700;
}

.boundary-cell {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  min-height: 32px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 5px;
  color: var(--muted);
  background: transparent;
  font-size: 10px;
  text-align: left;
  cursor: pointer;
}

.boundary-cell::before {
  content: "";
  flex: 0 0 auto;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}

.boundary-cell:hover {
  border-color: var(--line-2);
}

.cell-in {
  color: var(--teal);
  background: var(--teal-soft);
}

.cell-edge {
  color: var(--amber);
  background: var(--amber-soft);
}

.cell-out {
  color: var(--faint);
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 10px 12px;
  border-top: 1px solid var(--line);
  color: var(--faint);
  font-size: 10px;
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.legend i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.legend .is-in {
  color: var(--teal);
}

.legend .is-edge {
  color: var(--amber);
}

.legend .is-out {
  color: var(--faint);
}

.definition-callout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
  align-items: center;
  margin-top: 18px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper-2);
}

.definition-callout p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.definition-callout strong {
  color: var(--ink);
}

/* --------------------------------------------------------------------------
   Voices
   -------------------------------------------------------------------------- */

.voices-layout {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  gap: 34px;
  padding-top: 26px;
}

.topic-rail {
  position: sticky;
  top: 132px;
  align-self: start;
  display: grid;
  gap: 3px;
}

.topic-rail .rail-label {
  margin: 0 0 8px;
  color: var(--faint);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.topic-button {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 10px 11px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--muted);
  background: transparent;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
  transition: border-color 140ms ease, background-color 140ms ease, color 140ms ease;
}

.topic-button:hover {
  color: var(--ink);
  background: var(--paper);
}

.topic-button[aria-pressed="true"] {
  border-color: var(--line);
  color: var(--ink);
  background: var(--paper);
}

.topic-button b {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 400;
}

.topic-panel {
  min-width: 0;
}

.topic-head {
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

.topic-head h2 {
  margin: 0 0 8px;
  font-size: clamp(26px, 3vw, 38px);
}

.topic-question {
  margin: 0 0 10px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
}

.topic-thesis {
  max-width: 860px;
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.75;
}

.claim-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.claim-toolbar-label {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.06em;
}

.filter-chip {
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  background: transparent;
  font-size: 10px;
  cursor: pointer;
}

.filter-chip:hover,
.filter-chip[aria-pressed="true"] {
  border-color: var(--ink);
  color: var(--bg);
  background: var(--ink);
}

.claim-list {
  display: grid;
  gap: 10px;
  padding: 16px 0;
}

.claim-card {
  display: block;
  width: 100%;
  padding: 17px 18px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: inherit;
  background: var(--paper);
  text-align: left;
  cursor: pointer;
  transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
}

.claim-card:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

.claim-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  margin-bottom: 9px;
}

.avatar {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border: 1px solid var(--line-2);
  border-radius: 50%;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
}

.claim-speaker {
  display: grid;
  gap: 1px;
  line-height: 1.3;
}

.claim-speaker strong {
  font-size: 12px;
}

.claim-speaker span {
  color: var(--faint);
  font-size: 10px;
}

.attribution {
  margin-left: auto;
  padding: 2px 6px;
  border-radius: 3px;
  color: var(--violet);
  background: var(--violet-soft);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.03em;
  white-space: nowrap;
}

.claim-text {
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 13px;
  line-height: 1.75;
}

.claim-conditions {
  margin: 0 0 10px;
  padding-left: 11px;
  border-left: 1px solid var(--line-2);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.65;
}

.claim-conditions b {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 400;
  letter-spacing: 0.05em;
}

.claim-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.source-chip,
.topic-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 7px;
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--faint);
  background: transparent;
  font-size: 9px;
  line-height: 1.4;
}

.topic-chip {
  color: var(--teal);
  border-color: var(--teal);
}

.people-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.person-card {
  display: flex;
  flex-direction: column;
  min-height: 160px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: inherit;
  background: var(--paper);
  text-align: left;
  cursor: pointer;
  transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
}

.person-card:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

.person-card--todo {
  border-style: dashed;
  background: var(--paper-2);
}

.person-top {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}

.person-top .avatar {
  width: 34px;
  height: 34px;
}

.person-name {
  display: grid;
  gap: 1px;
  line-height: 1.3;
}

.person-name strong {
  font-size: 13px;
}

.person-name span {
  color: var(--faint);
  font-size: 10px;
}

.person-summary {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.65;
}

.person-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: auto;
  padding-top: 14px;
}

.index-table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.index-table {
  width: 100%;
  min-width: 760px;
  border-collapse: separate;
  border-spacing: 0;
}

.index-table th,
.index-table td {
  padding: 9px 10px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: left;
  font-size: 11px;
}

.index-table th:last-child,
.index-table td:last-child {
  border-right: 0;
}

.index-table tbody tr:last-child > * {
  border-bottom: 0;
}

.index-table thead th {
  color: var(--faint);
  background: var(--paper-2);
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.index-table tbody th {
  min-width: 150px;
  font-weight: 700;
}

.index-cell {
  width: 100%;
  min-height: 30px;
  padding: 4px 6px;
  border: 1px solid transparent;
  border-radius: 4px;
  color: var(--muted);
  background: transparent;
  font-family: var(--mono);
  font-size: 9px;
  text-align: center;
  cursor: pointer;
}

.index-cell[data-count="0"] {
  color: var(--faint);
  opacity: 0.55;
}

.index-cell:hover {
  border-color: var(--line-2);
  color: var(--ink);
  background: var(--accent-soft);
}

.conflict-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.conflict-card {
  display: flex;
  flex-direction: column;
  min-height: 190px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: inherit;
  background: var(--paper);
  text-align: left;
  cursor: pointer;
  transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
}

.conflict-card:hover {
  border-color: var(--violet);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

.conflict-type {
  color: var(--violet);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.conflict-card h3 {
  margin: 9px 0 7px;
  font-size: 19px;
}

.conflict-card p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.65;
}

.conflict-sides {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: auto;
  padding-top: 14px;
}

.conflict-sides span {
  padding: 3px 7px;
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--muted);
  font-size: 9px;
}

/* --------------------------------------------------------------------------
   Compare
   -------------------------------------------------------------------------- */

.compare-toolbar {
  display: grid;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}

.mode-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.mode-tab {
  padding: 8px 13px;
  border: 1px solid transparent;
  border-radius: 999px;
  color: var(--muted);
  background: transparent;
  font-size: 12px;
  cursor: pointer;
}

.mode-tab:hover {
  border-color: var(--line);
  color: var(--ink);
}

.mode-tab[aria-selected="true"] {
  border-color: var(--ink);
  color: var(--bg);
  background: var(--ink);
}

.toolbar-row {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 10px 14px;
}

.field {
  display: grid;
  gap: 4px;
}

.field span {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.field select,
.field input {
  min-height: 34px;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--paper);
  font-size: 11px;
}

.field input[type="search"] {
  min-width: 190px;
}

.toolbar-spacer {
  flex: 1 1 auto;
}

.matrix-wrap {
  margin-top: 16px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  max-height: 72vh;
}

.matrix-table {
  width: 100%;
  min-width: 1240px;
  border-collapse: separate;
  border-spacing: 0;
}

.matrix-table th,
.matrix-table td {
  padding: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.matrix-table th:last-child,
.matrix-table td:last-child {
  border-right: 0;
}

.matrix-table tbody tr:last-child > * {
  border-bottom: 0;
}

.matrix-table thead th {
  position: sticky;
  top: 0;
  z-index: 3;
  width: 128px;
  padding: 11px 9px;
  color: var(--muted);
  background: var(--paper-2);
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.03em;
  line-height: 1.5;
}

.matrix-table thead th:first-child {
  left: 0;
  z-index: 4;
  width: 148px;
}

.matrix-table tbody th {
  position: sticky;
  left: 0;
  z-index: 2;
  width: 148px;
  padding: 12px 10px;
  background: var(--paper);
  font-size: 11px;
  line-height: 1.45;
}

.matrix-table tbody th small {
  display: block;
  margin-top: 3px;
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 400;
}

.matrix-cell {
  display: flex;
  flex-direction: column;
  gap: 5px;
  width: 100%;
  min-height: 92px;
  padding: 9px;
  border: 0;
  color: inherit;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background-color 120ms ease;
}

.matrix-cell:hover {
  background: var(--accent-soft);
}

.cell-top {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8px;
  line-height: 1.2;
}

.dot {
  width: 5px;
  height: 5px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--faint);
}

.dot--done {
  background: var(--teal);
}

.dot--draft {
  background: var(--amber);
}

.dot--empty {
  background: var(--line-2);
}

.dot--disputed {
  background: var(--violet);
}

.cell-text {
  display: -webkit-box;
  overflow: hidden;
  color: var(--ink);
  font-size: 10px;
  line-height: 1.55;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}

.cell-evidence {
  margin-top: auto;
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8px;
}

.cell-empty {
  display: grid;
  place-items: center;
  min-height: 74px;
  border: 1px dashed var(--line-2);
  border-radius: 5px;
  color: var(--faint);
  font-size: 10px;
}

.matrix-cell.is-dimmed {
  opacity: 0.28;
}

.dimension-view {
  padding-top: 18px;
}

.dimension-intro {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
  align-items: end;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.dimension-intro h2 {
  margin: 0 0 6px;
  font-size: clamp(24px, 2.8vw, 34px);
}

.dimension-intro p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}

.dimension-list {
  display: grid;
  gap: 8px;
  padding-top: 16px;
}

.dimension-card {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr) auto;
  gap: 16px;
  align-items: center;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: inherit;
  background: var(--paper);
  text-align: left;
  cursor: pointer;
  transition: border-color 140ms ease, transform 140ms ease;
}

.dimension-card:hover {
  border-color: var(--accent);
  transform: translateX(2px);
}

.dimension-card strong {
  font-size: 13px;
}

.dimension-card small {
  display: block;
  margin-top: 2px;
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8px;
}

.dimension-card p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
}

.compare-two {
  padding-top: 18px;
}

.compare-selects {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.compare-table-wrap {
  overflow: auto;
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.compare-table {
  width: 100%;
  min-width: 900px;
  border-collapse: separate;
  border-spacing: 0;
}

.compare-table th,
.compare-table td {
  padding: 11px 12px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
  font-size: 11px;
  line-height: 1.65;
}

.compare-table th:last-child,
.compare-table td:last-child {
  border-right: 0;
}

.compare-table tbody tr:last-child > * {
  border-bottom: 0;
}

.compare-table thead th {
  color: var(--muted);
  background: var(--paper-2);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.04em;
}

.compare-table tbody th {
  width: 150px;
  font-weight: 700;
}

.compare-table button {
  width: 100%;
  border: 0;
  color: inherit;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.gap-view {
  padding-top: 18px;
}

.gap-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.gap-stat {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
}

.gap-stat b {
  display: block;
  font-family: var(--display);
  font-size: 28px;
  line-height: 1;
}

.gap-stat span {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 10px;
}

.progress {
  height: 5px;
  margin-top: 10px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--line);
}

.progress span {
  display: block;
  height: 100%;
  background: var(--teal);
}

.gap-columns {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.bar-list {
  display: grid;
  gap: 8px;
}

.bar-row {
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr) 44px;
  gap: 9px;
  align-items: center;
}

.bar-row span {
  color: var(--muted);
  font-size: 10px;
  line-height: 1.3;
}

.bar-row b {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 400;
  text-align: right;
}

.bar-track {
  display: flex;
  height: 7px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--line);
}

.bar-done {
  background: var(--teal);
}

.bar-draft {
  background: var(--amber);
}

.gap-list {
  display: grid;
  gap: 5px;
  margin-top: 10px;
}

.gap-list button {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border: 1px dashed var(--line);
  border-radius: 5px;
  color: var(--muted);
  background: transparent;
  font-size: 10px;
  text-align: left;
  cursor: pointer;
}

.gap-list button:hover {
  border-color: var(--accent);
  color: var(--ink);
}

/* --------------------------------------------------------------------------
   Sources
   -------------------------------------------------------------------------- */

.source-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.source-card {
  display: flex;
  flex-direction: column;
  min-height: 210px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: inherit;
  background: var(--paper);
  text-align: left;
  cursor: pointer;
  transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
}

.source-card:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

.source-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 9px;
}

.source-card h3 {
  margin: 0 0 8px;
  font-size: 18px;
}

.source-card p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.65;
}

.source-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: auto;
  padding-top: 14px;
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8px;
}

.method-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.method-card {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
}

.method-card h3 {
  margin: 0 0 7px;
  font-size: 15px;
}

.method-card p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

/* --------------------------------------------------------------------------
   Drawer
   -------------------------------------------------------------------------- */

.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(12, 14, 13, 0.46);
  backdrop-filter: blur(2px);
}

.drawer {
  position: fixed;
  inset: 0 0 0 auto;
  z-index: 70;
  width: min(580px, 100%);
  overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--shadow-deep);
  animation: drawer-in 220ms ease both;
}

@keyframes drawer-in {
  from {
    transform: translateX(24px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}

.drawer-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 15px;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
}

.drawer-head h2 {
  margin: 2px 0 0;
  font-size: clamp(24px, 2.6vw, 32px);
}

.drawer-body {
  padding: 20px 22px 40px;
}

.drawer-section {
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}

.drawer-section:last-child {
  border-bottom: 0;
}

.drawer-section h3 {
  margin: 0 0 8px;
  color: var(--faint);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.drawer-section p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.75;
}

.drawer-section p + p {
  margin-top: 8px;
}

.drawer-quote {
  margin: 0;
  padding: 13px 16px;
  border-left: 2px solid var(--accent);
  color: var(--ink);
  background: var(--accent-soft);
  font-size: 14px;
  line-height: 1.8;
}

.drawer-list {
  display: grid;
  gap: 7px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.drawer-list li {
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
}

.drawer-list li b {
  color: var(--ink);
}

.evidence-list {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.evidence-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 7px;
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--muted);
  font-size: 9px;
}

.evidence-chip--source {
  color: var(--teal);
  border-color: var(--teal);
}

.evidence-chip--concept {
  color: var(--violet);
  border-color: var(--violet);
}

.evidence-chip--empty {
  color: var(--faint);
  border-style: dashed;
}

.json-block {
  max-height: 320px;
  margin: 8px 0 0;
  padding: 12px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--muted);
  background: var(--paper-2);
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.form-row {
  display: grid;
  gap: 5px;
  margin-bottom: 12px;
}

.form-row label {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.form-row textarea,
.form-row input:not([type="checkbox"]),
.form-row select {
  width: 100%;
  padding: 8px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--bg);
  font-size: 12px;
  line-height: 1.6;
}

.form-row textarea {
  min-height: 90px;
  resize: vertical;
}

.evidence-picker {
  display: grid;
  grid-template-columns: 1fr;
  gap: 2px;
  max-height: 260px;
  padding: 10px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
}

.evidence-picker label {
  display: flex;
  gap: 6px;
  align-items: flex-start;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.45;
  cursor: pointer;
}

.evidence-picker input {
  width: auto;
  min-height: 0;
  margin: 3px 0 0;
  padding: 0;
  border: 0;
  background: transparent;
  accent-color: var(--accent);
}

.editor-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.inline-error {
  display: none;
  margin: 8px 0 0;
  padding: 7px 9px;
  border: 1px solid var(--accent);
  border-radius: 5px;
  color: var(--accent);
  background: var(--accent-soft);
  font-size: 10px;
}

.inline-error.is-visible {
  display: block;
}

/* --------------------------------------------------------------------------
   Search
   -------------------------------------------------------------------------- */

.search-dialog {
  width: min(760px, calc(100% - 28px));
  max-height: min(80vh, 760px);
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--ink);
  background: var(--paper);
  box-shadow: var(--shadow-deep);
}

.search-dialog::backdrop {
  background: rgba(12, 14, 13, 0.5);
  backdrop-filter: blur(3px);
}

.search-head {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: flex-start;
  padding: 20px 22px 12px;
}

.search-head h2 {
  margin: 0;
  font-size: 26px;
}

.search-field {
  display: block;
  padding: 0 22px;
}

.search-field input {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--line-2);
  border-radius: 7px;
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
}

.search-hint {
  margin: 8px 22px 0;
  color: var(--faint);
  font-size: 10px;
}

.search-results {
  max-height: min(52vh, 480px);
  padding: 10px 12px 18px;
  overflow: auto;
}

.search-result {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  align-items: start;
  gap: 12px;
  width: 100%;
  padding: 10px 11px;
  border: 0;
  border-radius: 6px;
  color: inherit;
  background: transparent;
  text-align: left;
  white-space: normal;
  overflow: visible;
  cursor: pointer;
}

.search-result:hover {
  background: var(--accent-soft);
}

.search-result-type {
  align-self: start;
  padding: 2px 5px;
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8px;
  line-height: 1.5;
  text-align: center;
}

.search-result-copy {
  display: block;
  min-width: 0;
  white-space: normal;
  overflow-wrap: anywhere;
}

.search-result-copy strong {
  display: block;
  font-size: 12px;
  line-height: 1.45;
}

.search-result-copy > span {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.55;
  white-space: normal;
  overflow-wrap: anywhere;
}

.drawer-section summary {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  cursor: pointer;
}

.drawer-section summary:hover {
  color: var(--ink);
}

button.bar-row {
  width: 100%;
  padding: 0;
  border: 0;
  color: inherit;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

button.bar-row:hover span:first-child {
  color: var(--accent);
}

.search-empty {
  margin: 0;
  padding: 24px 12px;
  color: var(--faint);
  font-size: 12px;
  text-align: center;
}

/* --------------------------------------------------------------------------
   Misc
   -------------------------------------------------------------------------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 90;
  max-width: min(520px, calc(100% - 32px));
  padding: 9px 14px;
  border: 1px solid var(--ink);
  border-radius: 999px;
  color: var(--bg);
  background: var(--ink);
  box-shadow: var(--shadow);
  font-size: 11px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition: opacity 180ms ease, transform 180ms ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

.site-footer {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  gap: 24px;
  width: min(var(--max), calc(100vw - 48px));
  margin: 40px auto 0;
  padding: 22px 0 30px;
  border-top: 1px solid var(--line);
  color: var(--faint);
  font-size: 10px;
}

.site-footer strong {
  display: block;
  color: var(--muted);
  font-family: var(--display);
  font-size: 13px;
}

.site-footer span {
  display: block;
  margin-top: 2px;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}

.footer-links a {
  color: var(--muted);
  text-decoration: none;
}

.footer-links a:hover {
  color: var(--accent);
}

/* --------------------------------------------------------------------------
   Responsive
   -------------------------------------------------------------------------- */

@media (max-width: 1120px) {
  .hero {
    grid-template-columns: 1fr;
    gap: 34px;
    padding-top: 48px;
  }

  .hero-map {
    max-width: 620px;
  }

  .entry-grid {
    grid-template-columns: 1fr;
  }

  .entry-card {
    min-height: 190px;
  }

  .stats {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .stat:nth-child(3n) {
    border-right: 0;
  }

  .stat:nth-child(-n + 3) {
    border-bottom: 1px solid var(--line);
  }

  .model-layers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .path {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .view-head {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .voices-layout {
    grid-template-columns: 1fr;
  }

  .topic-rail {
    position: static;
    display: flex;
    gap: 5px;
    padding-bottom: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .topic-rail::-webkit-scrollbar {
    display: none;
  }

  .topic-rail .rail-label {
    display: none;
  }

  .topic-button {
    flex: 0 0 auto;
    grid-template-columns: auto auto;
    white-space: nowrap;
  }

  .gap-columns {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 840px) {
  .site-header {
    flex-wrap: wrap;
    gap: 6px 14px;
    padding: 8px 18px;
  }

  .brand-copy small {
    display: none;
  }

  .main-nav {
    order: 3;
    width: 100%;
    padding-bottom: 2px;
  }

  .header-tools {
    margin-left: auto;
  }

  .header-tools .tool-button span:first-child {
    display: none;
  }

  .header-tools .tool-button {
    padding-inline: 10px;
  }

  .tool-button[data-action="search"]::before {
    content: "⌕";
    font-size: 16px;
    line-height: 1;
  }

  .tool-button[data-action="structure"]::before {
    content: "⌗";
    font-size: 14px;
    line-height: 1;
  }

  .tool-button[data-action="theme"]::before {
    content: "◐";
    font-size: 14px;
    line-height: 1;
  }

  .page,
  .site-footer {
    width: calc(100vw - 32px);
  }

  .era-group {
    grid-template-columns: 1fr;
    gap: 18px;
    padding: 26px 0;
  }

  .era-side {
    position: static;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 14px;
    align-items: baseline;
  }

  .era-side h2 {
    grid-column: 1;
  }

  .era-range {
    grid-column: 2;
    grid-row: 1;
  }

  .era-thesis {
    grid-column: 1 / -1;
  }

  .definition-panel {
    grid-template-columns: 1fr;
    padding: 20px;
  }

  .def-side {
    padding-left: 0;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    border-left: 0;
  }

  .people-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .conflict-grid {
    grid-template-columns: 1fr;
  }

  .source-grid {
    grid-template-columns: 1fr;
  }

  .method-grid {
    grid-template-columns: 1fr;
  }

  .gap-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .dimension-card {
    grid-template-columns: 130px minmax(0, 1fr);
  }

  .dimension-card .status-pill {
    grid-column: 2;
    justify-self: start;
  }

  .drawer {
    width: 100%;
  }
}

@media (max-width: 620px) {
  body {
    font-size: 14px;
  }

  .demo-banner {
    padding: 7px 12px;
    font-size: 10px;
  }

  .demo-banner span:last-child {
    display: none;
  }

  .site-header {
    min-height: 56px;
    padding: 7px 12px;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
  }

  .brand-copy strong {
    font-size: 13px;
  }

  .main-nav a {
    padding: 7px 10px;
    font-size: 12px;
  }

  .page,
  .site-footer {
    width: calc(100vw - 24px);
  }

  .header-tools {
    gap: 4px;
  }

  .header-tools kbd {
    display: none;
  }

  .header-tools .tool-button {
    min-width: 34px;
    padding: 6px 8px;
  }

  .view-head {
    padding: 32px 0 20px;
  }

  .view-title {
    font-size: 38px;
  }

  .view-lede {
    font-size: 14px;
  }

  .hero {
    padding-top: 34px;
  }

  .hero-title {
    font-size: clamp(48px, 15vw, 72px);
  }

  .hero-lede {
    font-size: 14px;
  }

  .stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .stat:nth-child(2n) {
    border-right: 0;
  }

  .stat:nth-child(3n) {
    border-right: 1px solid var(--line);
  }

  .stat:nth-child(-n + 4) {
    border-bottom: 1px solid var(--line);
  }

  .model-layers,
  .path {
    grid-template-columns: 1fr;
  }

  .definition-panel {
    padding: 16px;
  }

  .boundary-table {
    min-width: 760px;
  }

  .people-grid {
    grid-template-columns: 1fr;
  }

  .claim-card {
    padding: 14px;
  }

  .attribution {
    margin-left: 0;
  }

  .gap-summary {
    grid-template-columns: 1fr 1fr;
  }

  .bar-row {
    grid-template-columns: 90px minmax(0, 1fr) 38px;
  }

  .drawer-head {
    padding: 16px;
  }

  .drawer-body {
    padding: 16px 16px 36px;
  }

  .evidence-picker {
    grid-template-columns: 1fr;
  }

  .site-footer {
    flex-direction: column;
    gap: 12px;
  }

  .search-head h2 {
    font-size: 22px;
  }

  .search-result {
    grid-template-columns: 62px minmax(0, 1fr);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

function buildCells() {
  const cells = [];
  for (const game of DATA.games) {
    for (const dimension of DATA.dimensions) {
      const key = `${game.id}:${dimension.id}`;
      const fill = DATA.filledCells[key];
      cells.push({
        gameId: game.id,
        dimensionId: dimension.id,
        judgment: fill?.judgment || '',
        conditions: fill?.conditions || '',
        evidence: clone(fill?.evidence || []),
        status: fill?.status || 'empty',
        updated: fill ? '2026-11-11' : ''
      });
    }
  }
  return cells;
}

function getCell(gameId, dimensionId) {

function sourceOf(id) {
  return byId(DATA.sources, id);
}

function conceptOf(id) {

}

function gameOf(id) {

}

function dimensionOf(id) {

}

function personOf(id) {

function studioOf(id) {

}

function topicOf(id) {

}

function claimOf(id) {

}

function conflictOf(id) {
  return byId(DATA.conflicts, id);
}

function definitionOf(id) {
  return byId(DATA.definitions, id);
}

function eventOf(id) {
  for (const era of DATA.eras) {
    const event = era.events.find((item) => item.id === id);
    if (event) return { era, event };
  }
  return null;
}

function cellStatus(status) {
  return STATUS[status] || STATUS.empty;
}

function statusPill(status) {
  const item = cellStatus(status);
  return `<span class="status-pill status-pill--${item.modifier}">${item.label}</span>`;
}

function itemStatusPill(item) {
  if (!(item.claimIds || []).length) {
    return '<span class="status-pill status-pill--empty">待补</span>';
  }
  return statusPill(item.status);
}

function sourceChip(sourceId) {
  const source = sourceOf(sourceId);
  if (!source) return '';
  return `<span class="source-chip" title="${esc(source.author)} · ${esc(source.date)}">${esc(source.title)}</span>`;
}

function conceptChip(conceptId) {
  const concept = conceptOf(conceptId);
  if (!concept) return `<span class="chip">${esc(conceptId)}</span>`;
  return `<span class="chip" title="${esc(concept.summary)}">${esc(concept.title)}</span>`;
}

function gameChip(gameId) {
  const game = gameOf(gameId);
  return game ? `<span class="chip">${esc(game.title)}</span>` : `<span class="chip">${esc(gameId)}</span>`;
}

function evidenceLabel(item) {
  if (item.type === 'source') {
    const source = sourceOf(item.id);
    return source ? source.title : item.id;
  }
  const concept = conceptOf(item.id);
  return concept ? concept.title : item.id;
}

function evidenceChips(evidence = []) {
  if (!evidence.length) return '<span class="evidence-chip evidence-chip--empty">尚无证据</span>';
  return evidence.map((item) => `<span class="evidence-chip evidence-chip--${item.type}">${esc(evidenceLabel(item))}${item.locator ? ` · ${esc(item.locator)}` : ''}</span>`).join('');
}

function speakerOf(claim) {
  return personOf(claim.speakerId) || studioOf(claim.speakerId);
}

function claimMatchesPerson(claim, personId) {
  return claim.speakerId === personId || (claim.relatedPersonIds || []).includes(personId);
}

function claimsForPerson(personId) {
  return DATA.claims.filter((claim) => claimMatchesPerson(claim, personId));
}

function claimsForTopic(topicId) {
  return topicId === 'all' ? DATA.claims : DATA.claims.filter((claim) => claim.topicId === topicId);
}

function snippet(text, query) {
  const normalized = String(text || '').replace(/\s+/g, ' ').trim();
  if (!normalized) return '';
  const index = normalized.toLowerCase().indexOf(String(query || '').toLowerCase());
  const start = Math.max(0, index - 30);
  const end = Math.min(normalized.length, index + 90);
  return `${start ? '…' : ''}${normalized.slice(start, end)}${end < normalized.length ? '…' : ''}`;
}

function cellStats() {
  const stats = { reviewed: 0, draft: 0, empty: 0, disputed: 0, total: DATA.cells.length };
  for (const cell of DATA.cells) stats[cell.status] = (stats[cell.status] || 0) + 1;
  return stats;
}

function cellCountFor(gameId, dimensionId) {
  const cell = getCell(gameId, dimensionId);
  return cell ? cell.evidence.length : 0;
}

      <p class="claim-text">${esc(claim.text)}</p>
      <p class="claim-conditions"><b>条件 </b>${esc(claim.conditions || '来源未给出条件')}</p>

        ${source ? `<span class="source-chip">${esc(source.title)}</span>` : ''}

}

function personCard(item, type) {
  const isStudio = type === 'studio';
  const claimCount = (item.claimIds || []).length;
  return `
    <button class="person-card${item.status === 'draft' ? ' person-card--todo' : ''}" type="button" data-open="${type}" data-id="${esc(item.id)}">
      <span class="person-top">
        <span class="avatar">${esc(item.initials || item.name.slice(0, 1))}</span>
        <span class="person-name"><strong>${esc(item.name)}</strong><span>${esc(item.role || (isStudio ? '厂商' : ''))}${item.org ? ` · ${esc(item.org)}` : ''}</span></span>
      </span>
      <p class="person-summary">${esc(item.summary)}</p>
      <span class="person-foot">
        ${itemStatusPill(item)}
        <span class="muted small">${claimCount ? `${claimCount} 条观点` : '待补观点'}</span>
      </span>
      ${entityTag(`${type}:${item.id}`)}
    </button>
  `;
}

function conflictCard(conflict) {
  return `
    <button class="conflict-card" type="button" data-open="conflict" data-id="${esc(conflict.id)}">
      <span class="conflict-type">${esc(conflict.type)}</span>
      <h3>${esc(conflict.title)}</h3>
      <p>${esc(conflict.question)}</p>
      <span class="conflict-sides">${conflict.sides.map((side) => `<span>${esc(side.label)}</span>`).join('')}</span>
      ${entityTag(`conflict:${conflict.id}`)}
    </button>
  `;
}

    { id: 'all', label: '全部主题', count: DATA.claims.length },

  ];

  const peopleCards = DATA.people.map((person) => personCard(person, 'person')).join('');

    <tr>
      <th scope="row">${esc(topicItem.label)}</th>
      ${DATA.people.map((person) => {
        const count = DATA.claims.filter((claim) => claim.topicId === topicItem.id && claimMatchesPerson(claim, person.id)).length;
        return `<td><button class="index-cell" type="button" data-count="${count}" data-index-topic="${esc(topicItem.id)}" data-index-person="${esc(person.id)}" aria-label="${esc(topicItem.label)} · ${esc(person.name)}：${count} 条观点">${count || '—'}</button></td>`;

        <p class="view-lede">左边是设计难点，右边是谁在什么条件下说了什么。每条观点保留说话者、归属、条件和出处；人物、主题、冲突与对比单元格共享同一批观点。</p>
      </div>
      <div class="view-note"><strong>归属边界</strong>来源观点、转述、编者归纳分开。厂商立场不等于个人观点，一句话也不能扩成所有团队、所有时期的规律。</div>
    </div>

    <div class="voices-layout">
      <aside class="topic-rail" aria-label="难点主题">
        <p class="rail-label">TOPIC INDEX</p>
        ${railItems.map((item) => `
          <button class="topic-button" type="button" data-topic="${esc(item.id)}" aria-pressed="${state.voiceTopic === item.id}">

          </button>
        `).join('')}
      </aside>

      <div class="topic-panel">
        <div class="topic-head">
          <p class="kicker">${topic ? `TOPIC / ${esc(topic.id)}` : 'ALL TOPICS'}</p>
          <h2>${esc(topic ? topic.label : '全部主题')}</h2>
          <p class="topic-question">${esc(topic ? topic.question : '先读难点，再读谁在什么条件下说了什么。')}</p>
          <p class="topic-thesis">${esc(topic ? topic.thesis : '这里把“设计难点”和“制作观点”放在同一页：主题负责组织问题，人物负责提供立场，冲突负责显示张力。')}</p>
          ${topic ? `<div class="chip-row" style="margin-top:12px">${topic.conceptIds.map((id) => conceptChip(id)).join('')}</div>` : ''}
          ${entityTag(topic ? `topic:${topic.id}` : 'topic:all')}
        </div>

        <div class="claim-toolbar">
          <span class="claim-toolbar-label">说话者</span>

          ${DATA.people.map((person) => `<button class="filter-chip" type="button" data-person-filter="${esc(person.id)}" aria-pressed="${state.voicePerson === person.id}">${esc(person.name)}</button>`).join('')}
          <span class="muted small" style="margin-left:auto">${claims.length} 条观点</span>
        </div>

        <div class="claim-list">
          ${claims.length ? claims.map(claimCard).join('') : `<p class="search-empty">这个组合下还没有已整理的观点。可以切换主题或人物，或把它作为待补项。</p>`}
        </div>
      </div>
    </div>

    <section class="section" aria-labelledby="people-title">
      <div class="section-head">
        <h2 class="section-title" id="people-title">人物与厂商</h2>

      <p class="section-note">人物卡记录角色、所属、核心主张与来源；厂商卡记录公开立场。没有一手材料的厂商先留空位，不代写观点。</p>

          <tbody>${indexRows}</tbody>
        </table>
      </div>
      <p class="section-note" style="margin-top:10px">空白单元格表示这个主题下还没有该人物的已整理观点，不代表他反对或没有看法。后续补来源时应先加 claim，再回填这里。</p>
    </section>

    <section class="section" aria-labelledby="conflict-title">
      <div class="section-head">
        <h2 class="section-title" id="conflict-title">同一维度的分歧</h2>
        <span class="muted small">并列展示，不做正确性排名</span>
      </div>
      <p class="section-note">冲突卡不是“谁对谁错”，而是把同一维度上的目标、条件或定义差异摆出来。点击查看两侧的条件与来源。</p>
      <div class="conflict-grid">${DATA.conflicts.map(conflictCard).join('')}</div>
    </section>
  `;
}

function modeTab(id, label) {
  return `<button class="mode-tab" type="button" role="tab" data-mode="${id}" aria-selected="${state.compareMode === id}">${esc(label)}</button>`;
}

function statusDot(status) {
  return `<span class="dot dot--${cellStatus(status).dot}" aria-hidden="true"></span>`;
}

function matrixCell(game, dimension) {
  const cell = getCell(game.id, dimension.id);
  const status = cellStatus(cell.status);
  const dimmed = state.compareStatus !== 'all' && cell.status !== state.compareStatus;
  const evidenceCount = cell.evidence.length;
  return `
    <td>
      <button class="matrix-cell${dimmed ? ' is-dimmed' : ''}" type="button" data-open="cell" data-game="${esc(game.id)}" data-dim="${esc(dimension.id)}" title="${esc(cell.judgment || '待整理')}">
        <span class="cell-top">${statusDot(cell.status)}${status.label}${evidenceCount ? ` · ${evidenceCount}` : ''}</span>
        ${cell.judgment ? `<span class="cell-text">${esc(cell.judgment)}</span>` : `<span class="cell-empty">待整理</span>`}
        ${entityTag(`cell:${game.id}:${dimension.id}`)}
      </button>
    </td>
  `;
}

function renderMatrix() {
  const query = state.compareGameQuery.trim().toLowerCase();
  return `
    <div class="matrix-wrap">
      <table class="matrix-table">
        <thead>
          <tr>
            <th scope="col">游戏 / 系列</th>
            ${DATA.dimensions.map((dimension) => `<th scope="col">${esc(dimension.label)}<br><span style="color:var(--faint)">${esc(dimension.short)}</span></th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${DATA.games.map((game) => {
            const matched = !query || `${game.title} ${game.short} ${game.tags.join(' ')}`.toLowerCase().includes(query);
            return `<tr data-game-row data-title="${esc(`${game.title} ${game.short} ${game.tags.join(' ')}`)}"${matched ? '' : ' hidden'}>
              <th scope="row">${esc(game.title)}<small>${esc(game.short)}</small></th>
              ${DATA.dimensions.map((dimension) => matrixCell(game, dimension)).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderDimensionView() {
  const dimension = dimensionOf(state.compareDimension) || DATA.dimensions[0];
  const count = DATA.games.length;
  const reviewed = DATA.games.filter((game) => getCell(game.id, dimension.id)?.status === 'reviewed').length;
  const draft = DATA.games.filter((game) => getCell(game.id, dimension.id)?.status === 'draft').length;

  return `
    <div class="dimension-view">
      <div class="dimension-intro">
        <div>
          <p class="kicker">DIMENSION / ${esc(dimension.short)}</p>
          <h2>${esc(dimension.label)}</h2>
          <p>${esc(dimension.question)} ${esc(dimension.guidance)}</p>
        </div>
        <div class="muted small">${reviewed} 有依据 · ${draft} 草案 · ${count - reviewed - draft} 待整理</div>
      </div>
      <div class="dimension-list">
        ${DATA.games.map((game) => {
          const cell = getCell(game.id, dimension.id);
          return `
            <button class="dimension-card" type="button" data-open="cell" data-game="${esc(game.id)}" data-dim="${esc(dimension.id)}">
              <span><strong>${esc(game.title)}</strong><small>${esc(game.short)} · ${esc(game.tags.join(' / '))}</small></span>
              <p>${cell.judgment ? esc(cell.judgment) : '待整理：还没有这一维度的判断。'}</p>
              <span>${statusPill(cell.status)}</span>
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderTwoGame() {
  const gameA = gameOf(state.compareA) || DATA.games[0];
  const gameB = gameOf(state.compareB) || DATA.games[1];
  return `
    <div class="compare-two">
      <div class="compare-selects">
        <label class="field"><span>游戏 A</span><select data-compare-a>${DATA.games.map((game) => `<option value="${esc(game.id)}"${game.id === gameA.id ? ' selected' : ''}>${esc(game.title)}</option>`).join('')}</select></label>
        <label class="field"><span>游戏 B</span><select data-compare-b>${DATA.games.map((game) => `<option value="${esc(game.id)}"${game.id === gameB.id ? ' selected' : ''}>${esc(game.title)}</option>`).join('')}</select></label>
      </div>
      <div class="compare-table-wrap">
        <table class="compare-table">
          <thead><tr><th scope="col">维度</th><th scope="col">${esc(gameA.title)}</th><th scope="col">${esc(gameB.title)}</th></tr></thead>
          <tbody>
            ${DATA.dimensions.map((dimension) => {
              const cellA = getCell(gameA.id, dimension.id);
              const cellB = getCell(gameB.id, dimension.id);
              return `<tr>
                <th scope="row">${esc(dimension.label)}</th>
                <td><button type="button" data-open="cell" data-game="${esc(gameA.id)}" data-dim="${esc(dimension.id)}">${cellA.judgment ? esc(cellA.judgment) : '<span class="muted">待整理</span>'}</button></td>
                <td><button type="button" data-open="cell" data-game="${esc(gameB.id)}" data-dim="${esc(dimension.id)}">${cellB.judgment ? esc(cellB.judgment) : '<span class="muted">待整理</span>'}</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function barRow(label, reviewed, draft, total, attrs = '') {
  const done = total ? (reviewed / total) * 100 : 0;
  const draftWidth = total ? (draft / total) * 100 : 0;
  return `
    <button class="bar-row" type="button" ${attrs}>
      <span>${esc(label)}</span>
      <span class="bar-track"><span class="bar-done" style="width:${done}%"></span><span class="bar-draft" style="width:${draftWidth}%"></span></span>
      <b>${reviewed}/${total}</b>
    </button>
  `;
}

function renderGap() {
  const stats = cellStats();
  const pct = stats.total ? Math.round((stats.reviewed / stats.total) * 100) : 0;
  const empties = DATA.cells.filter((cell) => cell.status === 'empty').slice(0, 14);
  const dimensions = DATA.dimensions.map((dimension) => {
    const cells = DATA.cells.filter((cell) => cell.dimensionId === dimension.id);
    return {
      dimension,
      reviewed: cells.filter((cell) => cell.status === 'reviewed').length,
      draft: cells.filter((cell) => cell.status === 'draft').length,
      total: cells.length
    };
  });
  const games = DATA.games.map((game) => {
    const cells = DATA.cells.filter((cell) => cell.gameId === game.id);
    return {
      game,
      reviewed: cells.filter((cell) => cell.status === 'reviewed').length,
      draft: cells.filter((cell) => cell.status === 'draft').length,
      total: cells.length
    };
  });

  return `
    <div class="gap-view">
      <div class="gap-summary">
        <div class="gap-stat"><b>${stats.total}</b><span>总单元格</span></div>
        <div class="gap-stat"><b>${stats.reviewed}</b><span>有依据</span></div>
        <div class="gap-stat"><b>${stats.draft}</b><span>草案</span></div>
        <div class="gap-stat"><b>${stats.empty}</b><span>待整理</span></div>
      </div>
      <div class="progress" aria-label="有依据进度"><span style="width:${pct}%"></span></div>
      <p class="section-note" style="margin-top:8px">${pct}% 有依据。草案和空白不是失败，是下一步的入口；不要为了填满矩阵而编造判断。</p>

      <div class="gap-columns">
        <section aria-labelledby="gap-dim-title">
          <div class="section-head"><h3 class="section-title" id="gap-dim-title" style="font-size:19px">按维度</h3><span class="muted small">点一行切到该维度</span></div>
          <div class="bar-list">
            ${dimensions.map(({ dimension, reviewed, draft, total }) => barRow(dimension.label, reviewed, draft, total, `data-gap-dimension="${esc(dimension.id)}"`)).join('')}
          </div>
        </section>
        <section aria-labelledby="gap-game-title">
          <div class="section-head"><h3 class="section-title" id="gap-game-title" style="font-size:19px">按游戏</h3><span class="muted small">点一行筛选矩阵</span></div>
          <div class="bar-list">
            ${games.map(({ game, reviewed, draft, total }) => barRow(game.title, reviewed, draft, total, `data-gap-game="${esc(game.id)}"`)).join('')}
          </div>
        </section>
      </div>

      <section aria-labelledby="gap-list-title" style="margin-top:22px">
        <div class="section-head"><h3 class="section-title" id="gap-list-title" style="font-size:19px">待整理入口</h3><span class="muted small">前 ${empties.length} 个空白单元格</span></div>
        <div class="gap-list">
          ${empties.length ? empties.map((cell) => {
            const game = gameOf(cell.gameId);
            const dimension = dimensionOf(cell.dimensionId);
            return `<button type="button" data-open="cell" data-game="${esc(cell.gameId)}" data-dim="${esc(cell.dimensionId)}"><span>${esc(game.title)} · ${esc(dimension.label)}</span><span>打开 →</span></button>`;
          }).join('') : '<p class="search-empty">这个示例里的单元格已经填完了。重置示例或新增游戏/维度即可继续。</p>'}
        </div>
      </section>
    </div>
  `;
}

function renderCompare() {
  const el = document.getElementById('view-compare');
  const body = state.compareMode === 'matrix'
    ? renderMatrix()
    : state.compareMode === 'dimension'
      ? renderDimensionView()
      : state.compareMode === 'two'
        ? renderTwoGame()
        : renderGap();

  const dimensionField = state.compareMode === 'dimension'
    ? `<label class="field"><span>聚焦维度</span><select data-compare-dimension>${DATA.dimensions.map((dimension) => `<option value="${esc(dimension.id)}"${dimension.id === state.compareDimension ? ' selected' : ''}>${esc(dimension.label)}</option>`).join('')}</select></label>`
    : '';

  const matrixFields = state.compareMode === 'matrix'
    ? `<label class="field"><span>搜索游戏</span><input type="search" data-game-search value="${esc(state.compareGameQuery)}" placeholder="例如：鬼泣、魂式、横版"></label>
       <label class="field"><span>状态</span><select data-compare-status>
         <option value="all"${state.compareStatus === 'all' ? ' selected' : ''}>全部状态</option>
         <option value="reviewed"${state.compareStatus === 'reviewed' ? ' selected' : ''}>只看有依据</option>
         <option value="draft"${state.compareStatus === 'draft' ? ' selected' : ''}>只看草案</option>
         <option value="empty"${state.compareStatus === 'empty' ? ' selected' : ''}>只看待整理</option>
       </select></label>`
    : '';

  el.innerHTML = `
    <div class="view-head">
      <div>
        <p class="kicker">05 / COMPARISON WORKBENCH</p>
        <h1 class="view-title" id="compare-title">横向对比，从空白开始</h1>
        <p class="view-lede">同一批单元格生成四种视图：矩阵、按维度、双机、差距。你可以只填有证据的格子；空白就是下一步，不会被自动推断成结论。</p>
      </div>
      <div class="view-note"><strong>这是工作台，不是评分表</strong>判断必须附条件与证据；没有材料的格子保持“待整理”。</div>
    </div>

    <div class="compare-toolbar">
      <div class="mode-tabs" role="tablist" aria-label="对比视图">
        ${modeTab('matrix', '矩阵')}${modeTab('dimension', '按维度')}${modeTab('two', '双机对比')}${modeTab('gap', '差距')}
      </div>
      <div class="toolbar-row">
        ${dimensionField}
        ${matrixFields}
        <span class="toolbar-spacer"></span>
        <button class="button" type="button" data-action="export">导出 JSON</button>
        <button class="button button--ghost" type="button" data-action="reset">重置示例</button>
      </div>
    </div>

    ${body}

    <p class="demo-note" style="margin-top:16px"><strong>编辑演示：</strong>点击任意单元格可以修改判断、条件、状态和证据，矩阵会立即更新。修改只存在当前浏览器内存；正式版应写回 <code>content/</code> 并经过构建校验。</p>
  `;
}

function sourceCard(source) {
  const cells = DATA.cells.filter((cell) => cell.evidence.some((item) => item.type === 'source' && item.id === source.id));
  const claims = DATA.claims.filter((claim) => claim.sourceId === source.id);
  return `
    <button class="source-card" type="button" data-open="source" data-id="${esc(source.id)}">
      <span class="source-meta"><span class="chip">${esc(source.kind)}</span><span class="chip">${esc(source.date)}</span></span>
      <h3>${esc(source.title)}</h3>
      <p>${esc(source.scope)}</p>
      <span class="source-foot"><span>${esc(source.author)}</span><span>${claims.length} 条观点 · ${cells.length} 个格引用</span></span>
      ${entityTag(`source:${source.id}`)}
    </button>
  `;
}

function renderSources() {

  el.innerHTML = `
    <div class="view-head">

        <p class="kicker">06 / SOURCES &amp; METHOD</p>

      <div class="source-grid">${DATA.sources.map(sourceCard).join('')}</div>
    </section>

    <section class="section" aria-labelledby="method-title">
      <div class="section-head"><h2 class="section-title" id="method-title">三条记录规则</h2><span class="muted small">避免把推断写成事实</span></div>

      <div class="chip-row"><span class="chip chip--teal">source</span><span class="chip chip--teal">claim</span><span class="chip chip--teal">citation</span><span class="chip chip--amber">draft</span><span class="chip chip--amber">reviewed</span><span class="chip">empty</span></div>

function showToast(message) {
  if (!toastEl) return;
  toastEl.textContent = message;
  toastEl.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('is-visible'), 2600);
}

function updateProgress() {
  if (!progressEl) return;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const value = max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0;
  progressEl.style.width = `${value}%`;
}

function updateNav() {
  document.querySelectorAll('.main-nav a').forEach((link) => {
    if (link.dataset.view === currentView) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  const titles = {
    overview: '总览',
    history: '发展',
    definitions: '定义',
    voices: '难点与观点',
    compare: '横向对比',
    sources: '来源与方法'
  };
  document.title = `${titles[currentView] || '总览'} · 动作游戏研究`;
}

function currentViewFromHash() {
  const hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));
  return VIEWS.includes(hash) ? hash : 'overview';
}

function showView(view, { scroll = true } = {}) {
  const next = VIEWS.includes(view) ? view : 'overview';
  currentView = next;
  VIEWS.forEach((item) => {
    const section = document.getElementById(`view-${item}`);
    if (section) section.hidden = item !== next;
  });
  updateNav();
  if (scroll) window.scrollTo({ top: 0, behavior: 'auto' });
  requestAnimationFrame(updateProgress);
}

function navigate(view) {
  if (!VIEWS.includes(view)) view = 'overview';
  if (window.location.hash.replace(/^#/, '') !== view) {
    window.location.hash = view;
  } else {
    closeDrawer();
    showView(view);
  }
}

function openDrawer(html, opener) {
  if (!drawer || !backdrop) return;
  lastDrawerFocus = opener || document.activeElement;
  drawer.innerHTML = html;
  drawer.hidden = false;
  backdrop.hidden = false;
  document.body.classList.add('drawer-open');
  drawer.scrollTop = 0;
  drawerOpen = true;
  const focusTarget = drawer.querySelector('[data-close-drawer]') || drawer.querySelector('button, a, input, select, textarea');
  if (focusTarget) focusTarget.focus();
}

function closeDrawer() {
  if (!drawerOpen || !drawer || !backdrop) return;
  drawer.hidden = true;
  backdrop.hidden = true;
  document.body.classList.remove('drawer-open');
  drawerOpen = false;
  delete drawer.dataset.cell;
  drawer.innerHTML = '';
  if (lastDrawerFocus && typeof lastDrawerFocus.focus === 'function') lastDrawerFocus.focus();
  lastDrawerFocus = null;
}

function trapDrawerFocus(event) {
  if (!drawerOpen || !drawer || event.key !== 'Tab') return;
  const focusables = [...drawer.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
    .filter((element) => element.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

function saveCellFromDrawer() {
  if (!drawer?.dataset.cell) return;
  const [gameId, dimensionId] = drawer.dataset.cell.split(':');
  const cell = getCell(gameId, dimensionId);
  if (!cell) return;
  const judgment = drawer.querySelector('[data-cell-judgment]').value.trim();
  const conditions = drawer.querySelector('[data-cell-conditions]').value.trim();
  const status = drawer.querySelector('[data-cell-status]').value;
  const evidence = [...drawer.querySelectorAll('[data-evidence]:checked')].map((input) => {
    const [type, id] = input.value.split(':');
    const existing = cell.evidence.find((item) => item.type === type && item.id === id);
    return existing ? { ...existing } : { type, id };
  });
  const error = drawer.querySelector('[data-cell-error]');
  const showError = (message) => {
    if (error) {
      error.textContent = message;
      error.classList.add('is-visible');
    }
  };

  if (status !== 'empty' && !judgment) {
    showError('判断不能为空；如果还没整理，请把状态设为“待整理”。');
    return;
  }
  if (status === 'reviewed' && !evidence.length) {
    showError('“有依据”状态至少需要一条证据；可以先存为草案。');
    return;
  }

  cell.judgment = status === 'empty' ? '' : judgment;
  cell.conditions = status === 'empty' ? '' : conditions;
  cell.evidence = status === 'empty' ? [] : evidence;
  cell.status = status;
  cell.updated = today();

  closeDrawer();
  renderOverview();
  renderCompare();
  renderSources();
  buildSearchIndex();
  showToast('单元格已更新（仅本次演示，不写盘）');
}

function resetCellForm() {
  if (!drawer) return;
  const judgment = drawer.querySelector('[data-cell-judgment]');
  const conditions = drawer.querySelector('[data-cell-conditions]');
  const status = drawer.querySelector('[data-cell-status]');
  const error = drawer.querySelector('[data-cell-error]');
  if (judgment) judgment.value = '';
  if (conditions) conditions.value = '';
  if (status) status.value = 'empty';
  drawer.querySelectorAll('[data-evidence]').forEach((input) => { input.checked = false; });
  if (error) {
    error.textContent = '';
    error.classList.remove('is-visible');
  }
}

function openEntity(kind, id, extra = {}) {
  if (kind === 'event') return openEventDrawer(id);
  if (kind === 'definition') return openDefinitionDrawer(id);
  if (kind === 'boundary') return openBoundaryDrawer(id);
  if (kind === 'claim') return openClaimDrawer(id);
  if (kind === 'person') return openPersonDrawer(id, 'person');
  if (kind === 'studio') return openPersonDrawer(id, 'studio');
  if (kind === 'conflict') return openConflictDrawer(id);
  if (kind === 'source') return openSourceDrawer(id);
  if (kind === 'game') return openGameDrawer(id);
  if (kind === 'cell') {
    const [gameId, dimensionId] = String(id).includes(':') ? String(id).split(':') : [extra.game, extra.dim];
    return openCellDrawer(gameId, dimensionId);
  }
}

function buildSearchIndex() {
  const records = [];
  const push = (type, title, text, view, extra = {}) => records.push({ type, title, text, view, ...extra });

  push('页面', '总览', '动作游戏研究 发展 定义 难点 观点 对比 阅读路径', 'overview');
  push('页面', '发展', '动作游戏发展 时间轴 街机 3D 转型 传统 ACT 魂式框架 现代融合', 'history');
  push('页面', '定义', '常规定义 广义 ACT 大众认知 传统 ACT 魂式框架 动作冒险 AAVG 边界案例', 'definitions');
  push('页面', '难点与观点', '设计难点 制作人 厂商 观点 冲突 可读性 反应频率 深度', 'voices');
  push('页面', '横向对比', '横向对比 矩阵 维度 单元格 证据 差距 双机', 'compare');
  push('页面', '来源与方法', '来源 引用 编者归纳 待整理 证据', 'sources');

  DATA.definitions.forEach((definition) => {
    push('定义', definition.label, `${definition.thesis} ${definition.scope} ${definition.misuse}`, 'definitions', { open: 'definition', id: definition.id });
  });
  DATA.eras.forEach((era) => {
    era.events.forEach((event) => {
      push('发展', event.title, `${era.label} ${era.range} ${event.shift} ${event.games.map(gameName).join(' ')}`, 'history', { open: 'event', id: event.id });
    });
  });
  DATA.topics.forEach((topic) => {
    push('主题', topic.label, `${topic.question} ${topic.thesis}`, 'voices', { topicId: topic.id });
  });
  DATA.people.forEach((person) => {
    push('人物', person.name, `${person.role} ${person.org} ${person.summary}`, 'voices', { open: 'person', id: person.id });
  });
  DATA.studios.forEach((studio) => {
    push('厂商', studio.name, `${studio.role} ${studio.summary}`, 'voices', { open: 'studio', id: studio.id });
  });
  DATA.claims.forEach((claim) => {
    const speaker = speakerOf(claim);
    const topic = topicOf(claim.topicId);
    push('观点', `${speaker?.name || claim.speakerId}：${topic?.label || '观点'}`, claim.text, 'voices', { open: 'claim', id: claim.id });
  });
  DATA.conflicts.forEach((conflict) => {
    push('冲突', conflict.title, `${conflict.question} ${conflict.sides.map((side) => side.claim).join(' ')}`, 'voices', { open: 'conflict', id: conflict.id });
  });
  DATA.boundaryCases.forEach((item) => {
    push('边界', `${item.title} · 边界案例`, item.note, 'definitions', { open: 'boundary', id: item.id });
  });
  DATA.games.forEach((game) => {
    push('游戏', game.title, `${game.summary} ${game.tags.join(' ')}`, 'compare', { open: 'game', id: game.id });
  });
  DATA.sources.forEach((source) => {
    push('来源', source.title, `${source.author} ${source.scope}`, 'sources', { open: 'source', id: source.id });
  });
  DATA.cells.forEach((cell) => {
    if (cell.status === 'empty' || !cell.judgment) return;
    const game = gameOf(cell.gameId);
    const dimension = dimensionOf(cell.dimensionId);
    push('对比', `${game.title} · ${dimension.label}`, `${cell.judgment} ${cell.conditions}`, 'compare', { open: 'cell', id: `${cell.gameId}:${cell.dimensionId}` });
  });

  searchIndex = records;
}

function renderSearchResults() {
  if (!searchInput || !searchResultsEl) return;
  const query = searchInput.value.trim();
  if (!query) {
    searchResults = [];
    searchResultsEl.innerHTML = '<p class="search-empty">输入关键词，搜索页面、定义、事件、主题、人物、观点、冲突、游戏、对比单元格和来源。</p>';
    return;
  }
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  searchResults = searchIndex
    .map((record) => {
      const haystack = `${record.title} ${record.text}`.toLowerCase();
      if (!terms.every((term) => haystack.includes(term))) return null;
      const titleHits = terms.filter((term) => record.title.toLowerCase().includes(term)).length;
      const textHits = terms.filter((term) => record.text.toLowerCase().includes(term)).length;
      return { record, score: titleHits * 8 + textHits * 2 + (record.type === '页面' ? 1 : 0) };
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score)
    .slice(0, 18)
    .map((item) => item.record);

  if (!searchResults.length) {
    searchResultsEl.innerHTML = '<p class="search-empty">没有找到匹配内容。试试更短的关键词，或换一个概念名、人物名、游戏名。</p>';
    return;
  }

  searchResultsEl.innerHTML = searchResults.map((record, index) => `
    <button class="search-result" type="button" data-search-result="${index}">
      <span class="search-result-type">${esc(record.type)}</span>
      <span class="search-result-copy"><strong>${esc(record.title)}</strong><span>${esc(snippet(record.text, terms[0]))}</span></span>
    </button>
  `).join('');
}

function openSearch() {
  if (!searchDialog || !searchInput) return;
  lastSearchFocus = document.activeElement;
  if (typeof searchDialog.showModal === 'function' && !searchDialog.open) searchDialog.showModal();
  else searchDialog.setAttribute('open', '');
  searchInput.focus();
  renderSearchResults();
}

function closeSearch() {
  if (!searchDialog) return;
  if (searchDialog.open) searchDialog.close();
  searchDialog.removeAttribute('open');
  if (lastSearchFocus && typeof lastSearchFocus.focus === 'function') lastSearchFocus.focus();
  lastSearchFocus = null;
}

function goSearchResult(index) {
  const result = searchResults[index];
  if (!result) return;
  closeSearch();
  if (result.topicId) {
    state.voiceTopic = result.topicId;
    state.voicePerson = 'all';
    renderVoices();
  }
  if (result.view && result.view !== currentView) {
    if (window.location.hash.replace(/^#/, '') !== result.view) window.location.hash = result.view;
    else showView(result.view);
  }
  if (result.open) {
    window.setTimeout(() => openEntity(result.open, result.id), 90);
  } else if (result.topicId) {
    window.setTimeout(() => document.querySelector('.claim-list')?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 90);
  }
}

/* --------------------------------------------------------------------------
   Actions
   -------------------------------------------------------------------------- */

function toggleStructure() {
  document.body.classList.toggle('structure');
  const button = document.querySelector('[data-action="structure"]');
  if (button) button.setAttribute('aria-pressed', String(document.body.classList.contains('structure')));
  showToast(document.body.classList.contains('structure') ? '结构层：显示实体 ID 与数据位置' : '结构层：已关闭');
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const label = document.querySelector('[data-theme-label]');
  if (label) label.textContent = theme === 'graphite' ? '石墨' : '纸面';
  try { localStorage.setItem('agr-demo-theme', theme); } catch { /* file:// 或隐私模式可能不可用 */ }
}

function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'graphite' ? 'paper' : 'graphite';
  applyTheme(next);
}

function exportJson() {
  const payload = {
    meta: {
      title: '动作游戏研究 · 交互结构示例',
      exportedAt: new Date().toISOString(),
      note: '演示数据；不写入 content/，正式版需补来源与校验。'
    },
    dimensions: DATA.dimensions,
    games: DATA.games,
    cells: DATA.cells.filter((cell) => cell.status !== 'empty' || cell.judgment)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'action-game-comparison-demo.json';
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  showToast('已导出演示数据 JSON');
}

function resetDemo() {
  DATA.cells = clone(INITIAL_CELLS);
  renderOverview();
  renderCompare();
  renderSources();
  buildSearchIndex();
  showToast('示例已重置到初始状态');
}

/* --------------------------------------------------------------------------
   Events
   -------------------------------------------------------------------------- */

function handleDocumentClick(event) {
  const target = event.target.closest('[data-action], [data-definition], [data-era], [data-topic], [data-person-filter], [data-mode], [data-open], [data-close-drawer], [data-close-search], [data-search-result], [data-save-cell], [data-reset-cell], [data-index-topic], [data-index-person], [data-gap-dimension], [data-gap-game]');
  if (!target) return;

  if (target.hasAttribute('data-close-drawer')) {
    closeDrawer();
    return;
  }
  if (target.hasAttribute('data-close-search')) {
    closeSearch();
    return;
  }
  if (target.dataset.searchResult !== undefined) {
    goSearchResult(Number(target.dataset.searchResult));
    return;
  }
  if (target.hasAttribute('data-save-cell')) {
    saveCellFromDrawer();
    return;
  }
  if (target.hasAttribute('data-reset-cell')) {
    resetCellForm();
    return;
  }

  const action = target.dataset.action;
  if (action === 'search') return openSearch();
  if (action === 'structure') return toggleStructure();
  if (action === 'theme') return toggleTheme();
  if (action === 'export') return exportJson();
  if (action === 'reset') return resetDemo();

  if (target.dataset.definition) {
    state.definition = target.dataset.definition;
    renderDefinitions();
    return;
  }
  if (target.dataset.era) {
    state.era = target.dataset.era;
    renderHistory();
    return;
  }
  if (target.dataset.topic) {
    state.voiceTopic = target.dataset.topic;
    state.voicePerson = 'all';
    renderVoices();
    return;
  }
  if (target.dataset.personFilter) {
    state.voicePerson = target.dataset.personFilter;
    renderVoices();
    return;
  }
  if (target.dataset.indexTopic && target.dataset.indexPerson) {
    state.voiceTopic = target.dataset.indexTopic;
    state.voicePerson = target.dataset.indexPerson;
    renderVoices();
    window.setTimeout(() => document.querySelector('.claim-list')?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 50);
    return;
  }
  if (target.dataset.mode) {
    state.compareMode = target.dataset.mode;
    renderCompare();
    return;
  }
  if (target.dataset.gapDimension) {
    state.compareDimension = target.dataset.gapDimension;
    state.compareMode = 'dimension';
    renderCompare();
    return;
  }
  if (target.dataset.gapGame) {
    const game = gameOf(target.dataset.gapGame);
    state.compareGameQuery = game ? game.title : '';
    state.compareMode = 'matrix';
    renderCompare();
    return;
  }
  if (target.dataset.open) {
    openEntity(target.dataset.open, target.dataset.id, { game: target.dataset.game, dim: target.dataset.dim });
  }
}

function handleDocumentChange(event) {
  const target = event.target;
  if (target.matches('[data-compare-dimension]')) {
    state.compareDimension = target.value;
    renderCompare();
    return;
  }
  if (target.matches('[data-compare-status]')) {
    state.compareStatus = target.value;
    renderCompare();
    return;
  }
  if (target.matches('[data-compare-a]')) {
    state.compareA = target.value;
    renderCompare();
    return;
  }
  if (target.matches('[data-compare-b]')) {
    state.compareB = target.value;
    renderCompare();
  }
}

function handleDocumentInput(event) {
  const target = event.target;
  if (target.matches('[data-search-input]')) {
    renderSearchResults();
    return;
  }
  if (target.matches('[data-game-search]')) {
    const query = target.value.trim().toLowerCase();
    state.compareGameQuery = target.value;
    document.querySelectorAll('[data-game-row]').forEach((row) => {
      row.hidden = Boolean(query) && !String(row.dataset.title || '').toLowerCase().includes(query);
    });
  }
}

function handleDocumentKeydown(event) {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    openSearch();
    return;
  }
  if (event.key === 'Escape') {
    if (drawerOpen) {
      event.preventDefault();
      closeDrawer();
      return;
    }
    if (searchDialog?.open) {
      event.preventDefault();
      closeSearch();
    }
    return;
  }
  trapDrawerFocus(event);

  const definitionTab = event.target.closest('[data-definition]');
  if (definitionTab && ['ArrowLeft', 'ArrowRight'].includes(event.key)) {
    event.preventDefault();
    const tabs = [...document.querySelectorAll('[data-definition]')];
    const index = tabs.indexOf(definitionTab);
    const next = event.key === 'ArrowRight' ? (index + 1) % tabs.length : (index - 1 + tabs.length) % tabs.length;
    tabs[next].focus();
    state.definition = tabs[next].dataset.definition;
    renderDefinitions();
    document.querySelector(`[data-definition="${tabs[next].dataset.definition}"]`)?.focus();
    return;
  }

  const modeTab = event.target.closest('[data-mode]');
  if (modeTab && ['ArrowLeft', 'ArrowRight'].includes(event.key)) {
    event.preventDefault();
    const tabs = [...document.querySelectorAll('[data-mode]')];
    const index = tabs.indexOf(modeTab);
    const next = event.key === 'ArrowRight' ? (index + 1) % tabs.length : (index - 1 + tabs.length) % tabs.length;
    tabs[next].focus();
    state.compareMode = tabs[next].dataset.mode;
    renderCompare();
    document.querySelector(`[data-mode="${tabs[next].dataset.mode}"]`)?.focus();
  }
}

function init() {
  const flag = document.createElement('div');
  flag.className = 'structure-flag';
  flag.textContent = 'STRUCTURE / entity IDs visible';
  document.body.appendChild(flag);

  try {
    const savedTheme = localStorage.getItem('agr-demo-theme');
    applyTheme(savedTheme === 'graphite' ? 'graphite' : 'paper');
  } catch {
    applyTheme('paper');
  }

  document.addEventListener('click', handleDocumentClick);
  document.addEventListener('change', handleDocumentChange);
  document.addEventListener('input', handleDocumentInput);
  document.addEventListener('keydown', handleDocumentKeydown);
  document.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);
  window.addEventListener('hashchange', () => {
    closeDrawer();
    showView(currentViewFromHash());
  });

  if (searchDialog) {
    searchDialog.addEventListener('click', (event) => {
      if (event.target === searchDialog) closeSearch();
    });
  }

  renderAll();
  buildSearchIndex();
  showView(currentViewFromHash());
  updateProgress();
}

init();

  </script>
</body>
